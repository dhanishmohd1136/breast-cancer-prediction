server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Never let a stale index.html pin clients to a deleted asset bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Vite emits content-hashed filenames, so these are safe to cache hard.
    # `^~` keeps this winning over the regex block below.
    location ^~ /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # FastAPI's interactive docs would otherwise be reachable through the
    # proxy and enumerate the whole API to the public. Regex locations are
    # matched before the /api/ prefix block, so this wins.
    # Delete this block if you want the docs public.
    location ~ ^/api/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # Same-origin proxy to FastAPI. /api/predict -> backend:8000/predict,
    # which keeps the browser on one origin and leaves the backend CORS-free.
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # nginx's default mime.types has no entry for .webmanifest. An exact-match
    # location outranks the regex block below, so this sets the right type
    # without overriding the inherited types map.
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Static files that are NOT content-hashed (icons, manifest, robots).
    # Without this they would hit the SPA fallback below and a missing icon
    # would be served as HTML with a 200 instead of a clean 404.
    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|webmanifest|txt|xml|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths fall through to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container-level health probe that does not depend on the backend.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
